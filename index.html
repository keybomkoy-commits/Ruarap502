<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ruarap502</title>
    <link rel="icon" id="siteFavicon" href="">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes pageFadeIn {
            0% { opacity: 0; filter: blur(8px); transform: scale(1.02); }
            100% { opacity: 1; filter: blur(0); transform: scale(1); }
        }

        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        body {
            margin: 0; padding: 0; min-height: 100vh; height: 100dvh; width: 100vw;
            font-family: 'Inter', sans-serif; background-color: #030305; color: #ffffff;
            overflow-x: hidden; overflow-y: auto; display: flex; flex-direction: column;
            -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
            animation: pageFadeIn 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        #bg-image {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background-size: cover; background-position: center; background-repeat: no-repeat;
            z-index: 0; will-change: transform;
            filter: brightness(0.55) contrast(110%);
            animation: bgZoom 60s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate;
        }
        @keyframes bgZoom { 0% { transform: scale(1); } 100% { transform: scale(1.12); } }

        .bg-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at center, rgba(3, 3, 5, 0.65) 0%, rgba(5, 5, 10, 0.88) 75%, rgba(2, 2, 4, 0.97) 100%);
            z-index: 1; pointer-events: none;
        }

        #particleCanvas {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 2; pointer-events: none;
        }

        .main-content {
            position: relative; z-index: 3; flex: 1;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 40px 15px 120px 15px; width: 100%; max-width: 1200px; margin: auto;
            gap: clamp(18px, 2.5vh, 28px);
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        .emblem-container {
            position: relative; 
            width: clamp(190px, 24vw, 270px); 
            height: clamp(190px, 24vw, 270px);
            display: flex; justify-content: center; align-items: center;
            flex-shrink: 0;
            animation: logoFloat 4s ease-in-out infinite;
            will-change: transform;
            filter: drop-shadow(0 0 40px rgba(255, 255, 255, 0.4));
        }

        .emblem-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 50%;
            background: conic-gradient(from 0deg, transparent 50%, rgba(255,255,255,0.3) 75%, rgba(255,255,255,1) 100%);
            -webkit-mask: radial-gradient(circle closest-side, transparent 93%, black 95%);
            mask: radial-gradient(circle closest-side, transparent 93%, black 95%);
            animation: spinRingSmooth 4s linear infinite;
            z-index: 1; pointer-events: none;
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.7));
        }

        .emblem-container::after {
            content: '';
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 50%; border: 1.5px solid rgba(255, 255, 255, 0.2);
            box-sizing: border-box; z-index: 1; pointer-events: none;
        }

        @keyframes spinRingSmooth {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .main-logo {
            width: 85%; height: 85%; object-fit: contain;
            filter: drop-shadow(0 0 55px rgba(255, 255, 255, 0.7)); 
            z-index: 2; pointer-events: none;
        }

        .header-section { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; width: 100%; flex-shrink: 0; }

        .static-title-badge {
            padding: 0 10px; box-sizing: border-box; cursor: default; user-select: none;
            display: inline-block; max-width: 95vw; position: relative;
        }

        @keyframes textGradientShift {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        @keyframes titleGlow {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.25)) drop-shadow(0 0 40px rgba(255, 255, 255, 0.1)); }
            50% { transform: scale(1.015); filter: drop-shadow(0 0 35px rgba(255, 255, 255, 0.5)) drop-shadow(0 0 70px rgba(255, 255, 255, 0.25)); }
        }

        .main-title {
            font-family: 'Oswald', sans-serif; 
            font-size: clamp(2.5rem, 5vw, 4rem); 
            letter-spacing: 0.18em; margin: 0; font-weight: 700; text-transform: uppercase; 
            background: linear-gradient(to right, #ffffff 15%, #999999 50%, #ffffff 85%);
            background-size: 200% auto;
            color: transparent; -webkit-background-clip: text; background-clip: text;
            animation: titleGlow 4s ease-in-out infinite, textGradientShift 5s linear infinite;
            will-change: transform, filter, background-position;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            line-height: 1.1; padding-bottom: 5px; 
        }

        .dark-divider {
            display: flex; align-items: center; justify-content: center; gap: 15px; color: #888888;
            font-size: clamp(0.6rem, 1vw, 0.8rem); letter-spacing: 0.5em; text-transform: uppercase; font-weight: 600; 
            width: 100%; opacity: 0.9;
        }
        .dark-divider::before, .dark-divider::after {
            content: ''; width: clamp(35px, 9vw, 90px); height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
        }

        /* ----------------------------------------------------
           กลุ่มปุ่มเมนูหลัก
        ----------------------------------------------------- */
        @keyframes borderNeonGlow {
            0% { border-color: rgba(255, 255, 255, 0.15); box-shadow: 0 4px 15px rgba(0,0,0,0.3), inset 0 0 0 rgba(255,255,255,0); }
            50% { border-color: rgba(255, 255, 255, 0.45); box-shadow: 0 8px 25px rgba(0,0,0,0.5), inset 0 0 10px rgba(255,255,255,0.1); }
            100% { border-color: rgba(255, 255, 255, 0.15); box-shadow: 0 4px 15px rgba(0,0,0,0.3), inset 0 0 0 rgba(255,255,255,0); }
        }

        @keyframes giantNeonPulse {
            0% { border-color: rgba(255, 255, 255, 0.4); box-shadow: 0 0 25px rgba(255, 255, 255, 0.2), inset 0 0 12px rgba(255, 255, 255, 0.15); }
            50% { border-color: rgba(255, 255, 255, 0.9); box-shadow: 0 0 45px rgba(255, 255, 255, 0.5), inset 0 0 25px rgba(255, 255, 255, 0.35); }
            100% { border-color: rgba(255, 255, 255, 0.4); box-shadow: 0 0 25px rgba(255, 255, 255, 0.2), inset 0 0 12px rgba(255, 255, 255, 0.15); }
        }

        @keyframes shimmerEffect {
            0% { transform: translateX(-150%) rotate(25deg); opacity: 0; }
            50% { opacity: 0.3; }
            100% { transform: translateX(150%) rotate(25deg); opacity: 0; }
        }

        .btn-container {
            display: flex; flex-direction: column; align-items: center; gap: 12px; 
            width: 100%; max-width: 820px; z-index: 10;
        }

        .btn-row {
            display: flex; justify-content: center; align-items: center; gap: 10px; width: 100%;
            flex-wrap: wrap;
        }

        .btn-members {
            text-decoration: none; 
            background: linear-gradient(135deg, rgba(14, 14, 22, 0.3) 0%, rgba(6, 6, 10, 0.4) 100%); 
            border: 1.5px solid rgba(255, 255, 255, 0.16);
            border-radius: 14px; 
            padding: 12px 18px;
            color: #ffffff; 
            font-family: 'Inter', sans-serif;
            display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 6px 18px rgba(0,0,0,0.35);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); 
            box-sizing: border-box;
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            position: relative; overflow: hidden;
            width: 240px; height: 54px; flex-shrink: 0;
            animation: borderNeonGlow 4s infinite ease-in-out;
        }

        .btn-members::after {
            content: '';
            position: absolute;
            top: -60%; left: -60%;
            width: 220%; height: 220%;
            background: linear-gradient(
                90deg, 
                transparent, 
                rgba(255, 255, 255, 0.03), 
                rgba(255, 255, 255, 0.2), 
                rgba(255, 255, 255, 0.03), 
                transparent
            );
            transform: translateX(-150%) rotate(25deg);
            pointer-events: none;
            animation: shimmerEffect 4.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        /* ปุ่ม All Kings ด้านบน */
        .btn-king-top {
            width: 380px;
            height: 54px;
            background: linear-gradient(135deg, rgba(22, 22, 34, 0.4) 0%, rgba(10, 10, 16, 0.5) 100%);
            border-color: rgba(255, 255, 255, 0.28);
        }

        /* ปุ่ม FIVEZEROTWO ตรงกลาง ขยายใหญ่และยาวเด่นสุดๆ แบบพรีเมียมขั้นสุด */
        .btn-member-giant {
            width: 560px;
            height: 76px;
            background: linear-gradient(135deg, rgba(40, 40, 65, 0.75) 0%, rgba(15, 15, 25, 0.92) 100%);
            border: 2.5px solid rgba(255, 255, 255, 0.8);
            border-radius: 18px;
            padding: 16px 28px;
            animation: giantNeonPulse 3s infinite ease-in-out;
        }

        .btn-member-giant .btn-title {
            font-size: 1.35rem;
            letter-spacing: 0.22em;
            background: linear-gradient(90deg, #fff, #a4b0be, #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(255,255,255,0.7);
        }

        .btn-member-giant .btn-subtitle {
            font-size: 0.6rem;
            letter-spacing: 0.3em;
            color: #e0e0e0;
        }

        .btn-members:hover {
            border-color: #ffffff;
            background: rgba(255, 255, 255, 0.95);
            color: #030305;
            box-shadow: 0 0 50px rgba(255, 255, 255, 0.75), 0 20px 40px rgba(0,0,0,0.9);
            transform: translateY(-5px) scale(1.03); 
        }

        .btn-members:hover .btn-title { color: #030305; text-shadow: none; -webkit-text-fill-color: #030305; }
        .btn-members:hover .btn-subtitle { color: #444; }
        .btn-members:hover .btn-badge-count { background: rgba(0, 0, 0, 0.08); border-color: rgba(0, 0, 0, 0.2); color: #111; }

        .btn-info-group {
            display: flex; flex-direction: column; justify-content: center; gap: 2px;
            text-align: left; min-width: 0; flex: 1; z-index: 2; transition: color 0.3s;
        }

        .btn-title {
            font-size: 0.82rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #fff;
            text-shadow: 0 2px 6px rgba(0,0,0,0.8);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color 0.3s;
        }

        .btn-subtitle {
            font-size: 0.48rem; color: #aaa; letter-spacing: 0.2em; text-transform: uppercase; font-weight: 600;
            transition: color 0.3s;
        }

        .btn-badge-count {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 3px 9px; border-radius: 14px;
            font-size: 0.6rem; color: #ccc; font-weight: 600;
            display: flex; align-items: center; gap: 4px;
            letter-spacing: 0.05em; flex-shrink: 0; z-index: 2; transition: all 0.3s;
        }

        /* ----------------------------------------------------
           ปุ่ม Social ที่มุมซ้ายล่าง
        ----------------------------------------------------- */
        .social-bottom-left {
            position: fixed; bottom: 20px; left: 20px; z-index: 9998;
            display: flex; gap: 10px; align-items: center;
        }

        .social-icon-btn {
            width: 40px; height: 40px; border-radius: 50%;
            background: rgba(15, 15, 22, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px) saturate(130%);
            -webkit-backdrop-filter: blur(20px) saturate(130%);
            display: flex; justify-content: center; align-items: center;
            color: #fff; text-decoration: none; font-size: 0.95rem;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            transition: all 0.4s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .social-icon-btn:hover {
            background: #fff; color: #030305;
            border-color: #fff; transform: translateY(-3px) scale(1.1);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
        }

        .partner-section-wrapper {
            display: flex; flex-direction: column; align-items: center; gap: 5px; width: 100%; max-width: 700px; z-index: 10; margin-top: 2px;
        }
        .partner-heading {
            font-family: 'Oswald', sans-serif; font-size: clamp(0.6rem, 0.9vw, 0.7rem); letter-spacing: 0.35em; color: #777777; text-transform: uppercase; opacity: 0.8;
        }
        .partner-buttons-group { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; width: 100%; }

        @keyframes glowPulse {
            0%, 100% { box-shadow: 0 0 6px rgba(255, 255, 255, 0.03); border-color: rgba(255, 255, 255, 0.1); }
            50% { box-shadow: 0 0 16px rgba(255, 255, 255, 0.18); border-color: rgba(255, 255, 255, 0.3); }
        }

        .partner-btn {
            text-decoration: none; 
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 8px;
            padding: clamp(5px, 0.9vh, 8px) clamp(14px, 2.2vw, 24px);
            color: #aaa; 
            font-family: 'Inter', sans-serif; font-weight: 400; font-size: clamp(0.68rem, 0.9vw, 0.75rem);
            text-transform: uppercase; letter-spacing: 0.2em;
            backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
            transition: all 0.4s ease; text-align: center;
            position: relative; overflow: hidden; flex: 0 1 auto; z-index: 1;
            animation: glowPulse 3s infinite alternate ease-in-out;
        }

        .partner-btn:hover {
            border-color: #ffffff; color: #ffffff; background: rgba(255, 255, 255, 0.06);
            transform: translateY(-2px); box-shadow: 0 6px 15px rgba(0,0,0,0.7), 0 0 15px rgba(255, 255, 255, 0.25);
            letter-spacing: 0.22em; animation: none; 
        }

        /* MUSIC WIDGET */
        .music-widget {
            position: fixed; bottom: 20px; right: 20px; 
            background: rgba(15, 15, 22, 0.35); 
            backdrop-filter: blur(25px) saturate(130%); 
            -webkit-backdrop-filter: blur(25px) saturate(130%);
            border: 1px solid rgba(255, 255, 255, 0.14); 
            border-radius: 18px; 
            width: 280px; z-index: 99999; 
            transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1);
            overflow: hidden; display: flex; flex-direction: column; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.1);
        }
        .music-widget.collapsed { height: 66px; }
        .music-widget.expanded { height: 128px; border-color: rgba(255,255,255,0.28); box-shadow: 0 20px 45px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.2); }
        
        .music-header { display: flex; align-items: center; padding: 10px 14px; height: 66px; box-sizing: border-box; cursor: pointer; }
        
        .cover-wrapper { position: relative; width: 38px; height: 38px; margin-right: 12px; flex-shrink: 0; }
        .music-cover {
            width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
            box-shadow: 0 3px 10px rgba(0,0,0,0.5);
            animation: spinRecord 6s linear infinite; animation-play-state: paused;
            position: relative; z-index: 2; border: 1px solid rgba(255,255,255,0.25);
        }
        .playing .music-cover { animation-play-state: running; }
        @keyframes spinRecord { 100% { transform: rotate(360deg); } }

        .music-info-mini { flex: 1; display: flex; flex-direction: column; overflow: hidden; justify-content: center;}
        .info-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2px; padding-right: 5px; }
        .music-label { font-size: 0.4rem; color: #aaa; letter-spacing: 0.25em; font-weight: 700; }
        
        .eq-visualizer { display: flex; gap: 2px; align-items: flex-end; height: 10px; opacity: 0; transition: 0.3s; }
        .playing .eq-visualizer { opacity: 1; }
        .eq-visualizer span { width: 2px; background: #fff; border-radius: 2px; animation: eqBounce 1s infinite ease-in-out; }
        .eq-visualizer span:nth-child(1) { animation-delay: 0.1s; height: 60%; }
        .eq-visualizer span:nth-child(2) { animation-delay: 0.3s; height: 100%; }
        .eq-visualizer span:nth-child(3) { animation-delay: 0.0s; height: 40%; }
        @keyframes eqBounce { 0%, 100% { transform: scaleY(0.4); } 50% { transform: scaleY(1); } }

        .music-title { font-family: 'Oswald', sans-serif; font-size: 0.78rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; letter-spacing: 0.05em; text-shadow: 0 2px 5px rgba(0,0,0,0.5);}
        .music-link { font-size: 0.4rem; color: #888; text-decoration: none; transition: 0.3s; letter-spacing: 0.1em; }
        .music-link:hover { color: #fff; text-shadow: 0 0 8px rgba(255,255,255,0.6); }
        
        .toggle-icon { font-size: 0.45rem; color: #888; padding: 4px; transition: 0.4s cubic-bezier(0.19, 1, 0.22, 1); display: flex; align-items: center;}
        
        .music-controls { 
            display: flex; align-items: center; padding: 0 14px 12px 14px; gap: 12px; 
            opacity: 0; transition: opacity 0.4s; position: relative;
        }
        .music-controls::before {
            content: ''; position: absolute; top: 0; left: 14px; right: 14px; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
        }
        .music-widget.expanded .music-controls { opacity: 1; padding-top: 10px;}
        
        .ctrl-btn { 
            background: #ffffff; color: #000000; border: none; 
            width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-size: 0.65rem; 
            display: flex; justify-content: center; align-items: center; transition: all 0.3s cubic-bezier(0.19, 1, 0.22, 1);
            box-shadow: 0 3px 8px rgba(0,0,0,0.3);
        }
        .ctrl-btn:hover { background: #ffffff; transform: scale(1.1); box-shadow: 0 0 12px rgba(255, 255, 255, 0.5); }
        
        .vol-wrapper { flex: 1; display: flex; align-items: center; gap: 8px; }
        .vol-icon { font-size: 0.4rem; color: #aaa; font-family: 'Inter', sans-serif; font-weight: 600; letter-spacing: 0.1em; }
        .vol-slider { flex: 1; -webkit-appearance: none; height: 2.5px; background: rgba(255,255,255,0.18); outline: none; cursor: pointer; border-radius: 2px;}
        .vol-slider::-webkit-slider-thumb { 
            -webkit-appearance: none; width: 9px; height: 9px; border-radius: 50%; 
            background: #fff; cursor: pointer; transition: 0.2s; box-shadow: 0 0 6px rgba(255,255,255,0.8);
        }
        .vol-slider::-webkit-slider-thumb:hover { transform: scale(1.3); }

        .footer-credit {
            position: relative; z-index: 3; width: 100%; text-align: center; padding: 8px 0;
            font-size: 0.48rem; color: #777; letter-spacing: 0.3em; text-transform: uppercase; font-weight: 600;
            display: flex; justify-content: center; align-items: center; gap: 8px; flex-shrink: 0;
        }
        .footer-link-web { color: #999; text-decoration: none; transition: 0.3s; }
        .footer-link-web:hover { color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.6); }

        @media (max-width: 768px) {
            .btn-row {
                flex-direction: column;
                align-items: center;
            }
            .btn-members {
                width: 100%;
                max-width: 320px;
            }
            .btn-king-top, .btn-member-giant {
                width: 100%;
                max-width: 320px;
                height: 56px;
            }
            .btn-member-giant .btn-title {
                font-size: 0.95rem;
            }
            .music-widget {
                bottom: 12px; right: 12px; left: auto; width: 280px;
            }
            .social-bottom-left {
                bottom: 12px; left: 12px;
            }
        }
    </style>
</head>
<body>
    <div id="bg-image"></div>
    <div class="bg-overlay" id="bgOverlay"></div>
    <canvas id="particleCanvas"></canvas>

    <!-- ปุ่ม Social ที่มุมซ้ายล่าง -->
    <div class="social-bottom-left">
        <a href="https://facebook.com" id="socialFb" target="_blank" class="social-icon-btn" title="Facebook">
            <i class="fa-brands fa-facebook-f"></i>
        </a>
        <a href="https://discord.com" id="socialDc" target="_blank" class="social-icon-btn" title="Discord">
            <i class="fa-brands fa-discord"></i>
        </a>
    </div>

    <main class="main-content">
        <div class="emblem-container">
            <img id="mainLogo" src="" alt="Logo" class="main-logo" style="display: none;">
        </div>

        <header class="header-section">
            <div class="static-title-badge">
                <h1 id="dynMainTitle" class="main-title">loading...</h1>
            </div>
            <div class="dark-divider">
                <span>●</span>
                <span id="dynSubTitle">loading...</span>
                <span>●</span>
            </div>
        </header>
        
        <!-- กลุ่มปุ่มเมนูหลัก -->
        <div class="btn-container">
            <!-- 1. ปุ่ม All Kings ด้านบน -->
            <a href="king.html" class="btn-members btn-king-top">
                <div class="btn-info-group">
                    <span class="btn-title">All Kings</span>
                    <span class="btn-subtitle">MEMBERS</span>

    <script>
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function resizeCanvas() { 
            canvas.width = window.innerWidth; 
            canvas.height = window.innerHeight; 
        }
        window.addEventListener('resize', resizeCanvas); 
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width; 
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 1.8 + 0.6; 
                this.speedX = (Math.random() - 0.5) * 0.15;
                this.speedY = -(Math.random() * 0.35 + 0.08); 
                this.opacity = Math.random() * 0.4 + 0.1;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotSpeed = (Math.random() - 0.5) * 0.01;
                this.isCross = Math.random() > 0.5; 
            }
            update() {
                this.x += this.speedX; 
                this.y += this.speedY;
                this.rotation += this.rotSpeed;
                if (this.y < -20) {
                    this.y = canvas.height + 20;
                    this.x = Math.random() * canvas.width;
                }
                if (this.x < 0) this.x = canvas.width; 
                if (this.x > canvas.width) this.x = 0;
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.strokeStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.lineWidth = 1;

                if (this.isCross) {
                    const s = this.size * 2;
                    ctx.beginPath();
                    ctx.moveTo(-s, -s); ctx.lineTo(s, s);
                    ctx.moveTo(s, -s); ctx.lineTo(-s, s);
                    ctx.stroke();
                } else {
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        const particleCount = Math.floor((window.innerWidth * window.innerHeight) / 13000);
        for (let i = 0; i < particleCount; i++) particles.push(new Particle());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        animate();
    </script>

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        onSnapshot(collection(db, "members"), (snap) => {
            document.getElementById('count-member').innerText = snap.size;
        });
        onSnapshot(collection(db, "members2"), (snap) => {
            document.getElementById('count-member2').innerText = snap.size;
        });
        onSnapshot(collection(db, "members3"), (snap) => {
            document.getElementById('count-member3').innerText = snap.size;
        });
        onSnapshot(collection(db, "members4"), (snap) => {
            document.getElementById('count-member4').innerText = snap.size;
        });
        onSnapshot(collection(db, "kings"), (snap) => {
            document.getElementById('count-kings').innerText = snap.size;
        });

        const audio = document.getElementById('bgMusic');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const volumeSlider = document.getElementById('volumeSlider');
        const musicWidget = document.getElementById('musicWidget');
        const toggleMusicBtn = document.getElementById('toggleMusicBtn');
        const toggleIcon = document.getElementById('toggleIcon');
        
        let isPlaying = false; 
        audio.volume = 0.2;
        volumeSlider.value = 0.2;

        const savedTime = sessionStorage.getItem('musicCurrentTime');
        const userStopped = sessionStorage.getItem('userStoppedMusic');
        if (savedTime) audio.currentTime = parseFloat(savedTime);

        if (userStopped !== 'true' && sessionStorage.getItem('musicIsPlaying') === 'true') {
            audio.play().then(() => { playPauseBtn.innerHTML = '❚❚'; musicWidget.classList.add('playing'); isPlaying = true; }).catch(e=>{});
        }

        window.addEventListener('beforeunload', () => {
            sessionStorage.setItem('musicCurrentTime', audio.currentTime);
            sessionStorage.setItem('musicIsPlaying', isPlaying);
        });

        document.body.addEventListener('click', (e) => {
            if (sessionStorage.getItem('userStoppedMusic') === 'true') return;
            if (!isPlaying && !e.target.closest('#playPauseBtn') && !e.target.closest('.vol-slider') && !e.target.closest('.music-widget')) {
                audio.play().then(() => { 
                    playPauseBtn.innerHTML = '❚❚'; 
                    musicWidget.classList.add('playing'); 
                    isPlaying = true; 
                    sessionStorage.setItem('musicIsPlaying', 'true'); 
                    sessionStorage.setItem('userStoppedMusic', 'false');
                }).catch(e=>{});
            }
        });

        playPauseBtn.addEventListener('click', () => {
            if (isPlaying) { 
                audio.pause(); 
                playPauseBtn.innerHTML = '▶'; 
                musicWidget.classList.remove('playing'); 
                sessionStorage.setItem('musicIsPlaying', 'false');
                sessionStorage.setItem('userStoppedMusic', 'true');
            } else { 
                audio.play().then(() => { 
                    playPauseBtn.innerHTML = '❚❚'; 
                    musicWidget.classList.add('playing'); 
                    sessionStorage.setItem('musicIsPlaying', 'true');
                    sessionStorage.setItem('userStoppedMusic', 'false');
                }).catch(e=>{}); 
            }
            isPlaying = !isPlaying;
        });

        volumeSlider.addEventListener('input', (e) => { audio.volume = e.target.value; });
        toggleMusicBtn.addEventListener('click', (e) => {
            if (e.target.tagName.toLowerCase() === 'a') return;
            musicWidget.classList.toggle('collapsed');
            musicWidget.classList.toggle('expanded');
            toggleIcon.style.transform = musicWidget.classList.contains('expanded') ? 'rotate(180deg)' : 'rotate(0deg)';
        });

        onSnapshot(doc(db, "settings", "homepage"), (docSnap) => {
            if (docSnap.exists()) {
                const cfg = docSnap.data();
                if (cfg.bgUrl) document.getElementById('bg-image').style.backgroundImage = `url('${cfg.bgUrl}')`;
                if (cfg.faviconUrl) document.getElementById('siteFavicon').href = cfg.faviconUrl;
                if (cfg.mainTitle) document.getElementById('dynMainTitle').innerText = cfg.mainTitle;
                if (cfg.subTitle) document.getElementById('dynSubTitle').innerText = cfg.subTitle;
                if (cfg.logoUrl) {
                    const logo = document.getElementById('mainLogo');
                    logo.src = cfg.logoUrl; logo.style.display = 'block';
                    if (cfg.logoWidth) logo.style.width = cfg.logoWidth;
                }
                if (cfg.musicTitle) document.getElementById('musicTitle').innerText = cfg.musicTitle;
                if (cfg.musicLinkText) document.getElementById('musicLink').innerText = cfg.musicLinkText;
                if (cfg.musicLinkUrl) document.getElementById('musicLink').href = cfg.musicLinkUrl;
                if (cfg.musicCoverUrl) document.getElementById('musicCover').src = cfg.musicCoverUrl;
                
                if (cfg.facebookUrl) document.getElementById('socialFb').href = cfg.facebookUrl;
                if (cfg.discordUrl) document.getElementById('socialDc').href = cfg.discordUrl;
            }
        });

        onSnapshot(collection(db, "partners"), (snapshot) => {
            const partnerGroup = document.getElementById('partnerButtonsGroup');
            const partnerWrapper = document.getElementById('partnerSectionWrapper');
            partnerGroup.innerHTML = '';
            
            if (snapshot.empty) {
                partnerWrapper.style.display = 'none';
                return;
            }

            partnerWrapper.style.display = 'flex';
            snapshot.forEach((docSnap) => {
                const p = docSnap.data();
                const a = document.createElement('a');
                a.href = p.url || '#';
                a.target = '_blank';
                a.className = 'partner-btn';
                a.innerText = p.name;
                partnerGroup.appendChild(a);
            });
        });
    </script>
